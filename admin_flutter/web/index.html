<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lonora admin console">
  <meta http-equiv="Cache-Control" content="no-store">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lonora Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lonora — Admin</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Evict the service worker this console used to ship.
    //
    // Earlier builds registered Flutter's default service worker, which
    // caches the app shell and serves it offline-first. That is why an
    // operator kept seeing a console three screens out of date after the new
    // one was deployed: the browser was answering from the old cache, not
    // from the server. Builds no longer generate one (--pwa-strategy=none),
    // but a worker already registered in someone's browser stays registered
    // and keeps serving until something removes it. This is that something.
    //
    // It can run at all because Flutter's worker fetched the index
    // online-first, so this file reaches the browser even while the rest is
    // being served from its cache. Unregister, drop the caches, then reload
    // ONCE so the page comes back cleanly from the network. After that no
    // worker is ever registered again and this block does nothing.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        return Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () {
            return window.caches ? caches.keys() : [];
          })
          .then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          })
          .then(function () { window.location.reload(); });
      }).catch(function () {
        // A browser that refuses the query is a browser with nothing stale
        // to evict; the console loads normally either way.
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
