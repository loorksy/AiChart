name: lonora_admin
description: "Lonora admin console — Flutter companion app for /api/admin/*."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  # Already present transitively; declared so the file picker may import it.
  # A web-only picker is enough — the console ships as `flutter build web`.
  web: ^1.1.0
  # Transitive via `http`; declared so the multipart helper may name a type.
  http_parser: ^4.1.0
  google_fonts: ^6.3.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
