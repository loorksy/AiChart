# Paste inside server { } for aichart.lork.cloud — BEFORE the catch-all location / {
# MT5 /connect via bridge can take ~90s; default nginx proxy_read_timeout is 60s → 504.

    location ^~ /api/ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Model-first analysis (xhigh + multi-image) can exceed 2 minutes.
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_connect_timeout 30;
    }
