# Optional: serve the Flutter admin console straight from disk.
#
# Not required. `infra/build-admin-app.sh` publishes the bundle into the
# Next.js public/ directory, so /admin-app/ already works through the app
# server. Use this block only if you prefer nginx to serve the static files
# without touching node — paste it inside server { } BEFORE the catch-all
# location / {.
#
# try_files … /admin-app/index.html is what makes a deep link work: the app
# routes on the client, so any path under /admin-app/ must return index.html
# rather than a 404.

    location ^~ /admin-app/ {
        alias /opt/aichart/public/admin-app/;
        try_files $uri $uri/ /admin-app/index.html;

        # The bundle is content-hashed except for these two, which must never
        # be cached or an operator keeps loading yesterday's console.
        location ~ ^/admin-app/(index\.html|flutter_service_worker\.js)$ {
            alias /opt/aichart/public/admin-app/$1;
            add_header Cache-Control "no-store";
        }
    }
