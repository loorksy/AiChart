# Optional: serve the Flutter admin console straight from disk.
#
# Not required. `infra/build-admin-app.sh` publishes the bundle into the
# Next.js public/ directory, so /admin-app/ already works through the app
# server — with the cache rules defined in next.config.ts. Use this block
# only if you prefer nginx to serve the static files without touching node;
# paste it inside server { } BEFORE the catch-all location / {.
#
# It MUST mirror those cache rules. Flutter's web output does not
# content-hash its filenames — every build writes the same main.dart.js —
# so serving this bundle with nginx's defaults would let a browser keep an
# old build under the current build's name, which is the exact failure the
# next.config.ts headers exist to prevent.
#
# try_files … /admin-app/index.html is what makes a deep link work: the app
# routes on the client, so any path under /admin-app/ must return index.html
# rather than a 404.

    location ^~ /admin-app/ {
        alias /opt/aichart/public/admin-app/;
        try_files $uri $uri/ /admin-app/index.html;

        # Everything revalidates before use; a 304 keeps the multi-MB
        # canvaskit payload from being re-sent.
        add_header Cache-Control "no-cache" always;

        # The entry points decide which code runs. They are a few KB, and
        # they are never taken from cache at all.
        location ~ ^/admin-app/(index\.html|flutter_bootstrap\.js|main\.dart\.js|version\.json|flutter_service_worker\.js)$ {
            alias /opt/aichart/public/admin-app/$1;
            add_header Cache-Control "no-store, must-revalidate" always;
        }
    }
