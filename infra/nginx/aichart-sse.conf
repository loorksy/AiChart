# Paste inside server { } BEFORE location ^~ /api/
# EventSource is not a websocket. The generic API block sets
# `Connection $connection_upgrade` which becomes `close` for a normal GET
# and can leave a half-dead HTTP/2 stream that never fires onerror.

location ^~ /api/market/ticks {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}

