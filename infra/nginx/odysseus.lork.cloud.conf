# Odysseus primary UI — paste to /etc/nginx/sites-available/odysseus.lork.cloud
# Requires: certbot cert for odysseus.lork.cloud, odysseus on 127.0.0.1:7000

server {
    listen 443 ssl http2;
    server_name odysseus.lork.cloud;

    ssl_certificate /etc/letsencrypt/live/odysseus.lork.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odysseus.lork.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name odysseus.lork.cloud;
    return 301 https://$host$request_uri;
}
