# Optional: correct MIME if nginx serves public/ directly.
# Not required when Next.js serves /admin-android/* (next.config.ts headers
# + src/app/admin-android/[file]/route.ts). Paste inside server { } BEFORE
# the catch-all location / {.

    location = /admin-android/lonora-admin.apk {
        alias /opt/aichart/public/admin-android/lonora-admin.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="lonora-admin.apk"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /admin-android/version.json {
        alias /opt/aichart/public/admin-android/version.json;
        default_type application/json;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
