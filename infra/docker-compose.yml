services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ../web/.env
    environment:
      - MT5_BRIDGE_URL=http://mt5:18812
      - MT5_BRIDGE_TOKEN=${MT5_BRIDGE_TOKEN:-}
      - TRADINGVIEW_MCP_ENABLED=${TRADINGVIEW_MCP_ENABLED:-0}
      - PLAYWRIGHT_BROWSERS_PATH=/app/.playwright-browsers
      # Shared cache / rate-limit / EA-quote L2 + cross-instance lock backing.
      # Required once more than one web/worker replica runs.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - RESEARCH_SERVICE_ENABLED=${RESEARCH_SERVICE_ENABLED:-0}
      - RESEARCH_SERVICE_URL=http://research:8090
      - RESEARCH_SERVICE_INTERNAL_TOKEN=${RESEARCH_SERVICE_INTERNAL_TOKEN:-}
      - RESEARCH_SWARM_ENABLED=${RESEARCH_SWARM_ENABLED:-0}
      - RESEARCH_SWARM_PRESETS_ENABLED=${RESEARCH_SWARM_PRESETS_ENABLED:-0}
    volumes:
      - aichart-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - research-internal

  # Loopback ingress for the pm2 deployment layout, where web/worker run on
  # the HOST (RESEARCH_SERVICE_URL=http://127.0.0.1:8090) rather than as
  # compose services. The research service itself stays on the INTERNAL-only
  # network (no egress — docker cannot and must not publish its ports
  # directly); this proxy bridges default ⇄ research-internal and binds
  # strictly to 127.0.0.1.
  research-ingress:
    profiles: ["research"]
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:8090,fork,reuseaddr TCP:research:8090
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - research
    networks:
      - default
      - research-internal
    restart: unless-stopped

  research:
    profiles: ["research"]
    build:
      context: ../research-service
      dockerfile: Dockerfile
    expose:
      - "8090"
    environment:
      - RESEARCH_SERVICE_ENV=production
      - RESEARCH_SERVICE_INTERNAL_TOKEN=${RESEARCH_SERVICE_INTERNAL_TOKEN:-}
      - RESEARCH_SERVICE_WORK_DIR=/var/lib/aichart-research/work
      - RESEARCH_SERVICE_ARTIFACT_DIR=/var/lib/aichart-research/artifacts
      - RESEARCH_SERVICE_STORAGE=sqlite
      - RESEARCH_SERVICE_JOB_DB_PATH=/var/lib/aichart-research/work/research-jobs.sqlite3
      - RESEARCH_SERVICE_MAX_CONCURRENT_JOBS=${RESEARCH_SERVICE_MAX_CONCURRENT_JOBS:-1}
      # 50k-bar pipeline samples need more than the 300s default per job.
      - RESEARCH_SERVICE_MAX_TIMEOUT_SECONDS=${RESEARCH_SERVICE_MAX_TIMEOUT_SECONDS:-600}
      - RESEARCH_SERVICE_MAX_REQUEST_BYTES=${RESEARCH_SERVICE_MAX_REQUEST_BYTES:-8388608}
      - RESEARCH_SERVICE_MAX_ARTIFACT_BYTES=${RESEARCH_SERVICE_MAX_ARTIFACT_BYTES:-8388608}
      - RESEARCH_SERVICE_NETWORK_MODE=isolated
      - RESEARCH_SWARM_ENABLED=${RESEARCH_SWARM_ENABLED:-0}
      - RESEARCH_SWARM_PRESETS_ENABLED=${RESEARCH_SWARM_PRESETS_ENABLED:-0}
      - RESEARCH_SWARM_DB_PATH=/var/lib/aichart-research/work/research-swarm.sqlite3
    volumes:
      - research-artifacts:/var/lib/aichart-research/artifacts
      - research-work:/var/lib/aichart-research/work
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.00
    restart: unless-stopped
    networks:
      - research-internal

  mt5:
    build:
      context: ./mt5
    ports:
      - "127.0.0.1:18812:18812"
    environment:
      - MT5_BRIDGE_TOKEN=${MT5_BRIDGE_TOKEN:-}
      - MT5_CONNECT_CAPABLE=${MT5_CONNECT_CAPABLE:-0}
    volumes:
      - mt5-data:/data
    restart: unless-stopped

  mcp:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mcp
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - ../web/.env
    environment:
      - AICHART_API_URL=http://web:3000
      - MCP_PORT=8787
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-http://127.0.0.1:8787/mcp}
      - MCP_AUTH_MODE=${MCP_AUTH_MODE:-oauth}
    depends_on:
      - web
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
    command: ["npm", "run", "worker"]
    env_file:
      - ../web/.env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MT5_BRIDGE_URL=http://mt5:18812
      - MT5_BRIDGE_TOKEN=${MT5_BRIDGE_TOKEN:-}
    volumes:
      - aichart-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  aichart-data:
  mt5-data:
  research-artifacts:
  research-work:
  redis-data:

networks:
  research-internal:
    internal: true
