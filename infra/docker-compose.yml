services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../web/.env
    environment:
      - MT5_BRIDGE_URL=http://mt5:18812
      - MT5_BRIDGE_TOKEN=${MT5_BRIDGE_TOKEN:-}
      - BINANCE_CAPTURE_ENABLED=${BINANCE_CAPTURE_ENABLED:-1}
      - PLAYWRIGHT_BROWSERS_PATH=/app/.playwright-browsers
      # Shared cache / rate-limit / EA-quote L2 + cross-instance lock backing.
      # Required once more than one web/worker replica runs.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - aichart-data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  mt5:
    build:
      context: ./mt5
    ports:
      - "127.0.0.1:18812:18812"
    environment:
      - MT5_BRIDGE_TOKEN=${MT5_BRIDGE_TOKEN:-}
    volumes:
      - mt5-data:/data
    restart: unless-stopped

  mcp:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mcp
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - ../web/.env
    environment:
      - AICHART_API_URL=http://web:3000
      - MCP_PORT=8787
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-http://127.0.0.1:8787/mcp}
      - MCP_AUTH_MODE=${MCP_AUTH_MODE:-oauth}
    depends_on:
      - web
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

volumes:
  aichart-data:
  mt5-data:
