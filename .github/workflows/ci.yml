name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  trading:
    name: Odysseus trading engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odysseusai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "SQLAlchemy>=2" cryptography bcrypt pyotp \
            httpx pydantic pydantic-settings python-multipart python-dotenv \
            beautifulsoup4 numpy markdown nh3 icalendar python-dateutil \
            "qrcode[pil]" croniter pytest pytest-asyncio httpx2
      - name: Trading engine tests
        run: python -m pytest tests/test_trading_engine.py -q
