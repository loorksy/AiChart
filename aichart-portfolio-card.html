<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AiChart — بطاقة الحساب</title>
<style>
  :root{
    --bg:#0E1116; --surface:#171B22; --surface-2:#1E242D;
    --line:#262C36; --line-soft:#20262F;
    --txt:#E6E9EF; --muted:#8A93A3; --faint:#5C6674;
    --gold:#E0B15E; --gold-dim:#8A7038;
    --up:#3FB27F; --down:#E5636B;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--txt); font-family:var(--sans);
    font-size:14px; line-height:1.4; padding:14px;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .card{
    max-width:480px; margin:0 auto; background:var(--surface);
    border:1px solid var(--line); border-radius:16px; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }

  /* header */
  .hd{display:flex; align-items:center; gap:10px; padding:14px 16px 12px; border-bottom:1px solid var(--line-soft)}
  .brand{display:flex; align-items:baseline; gap:7px}
  .brand b{font-weight:700; letter-spacing:.2px}
  .brand b .ai{color:var(--gold)}
  .brand small{color:var(--faint); font-family:var(--mono); font-size:11px}
  .hd .spacer{flex:1}
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600;
    padding:4px 9px; border-radius:999px; border:1px solid var(--line)}
  .pill .dot{width:7px; height:7px; border-radius:50%}
  .pill.off{color:var(--down); border-color:#3a2429; background:#22151799}
  .pill.off .dot{background:var(--down)}
  .pill.on{color:var(--up); border-color:#1e352b; background:#14211b99}
  .pill.on .dot{background:var(--up); box-shadow:0 0 0 3px #3fb27f33}
  .refresh{appearance:none; background:var(--surface-2); color:var(--muted); border:1px solid var(--line);
    width:30px; height:30px; border-radius:9px; cursor:pointer; display:grid; place-items:center; transition:.15s}
  .refresh:hover{color:var(--txt); border-color:#333c48}
  .refresh:active{transform:rotate(180deg)}
  .refresh svg{width:15px; height:15px}

  /* equity block */
  .eq{padding:16px}
  .eq .lbl{color:var(--muted); font-size:11px; letter-spacing:.4px; text-transform:uppercase}
  .eq .big{font-family:var(--mono); font-size:34px; font-weight:600; letter-spacing:-.5px; margin-top:2px; font-variant-numeric:tabular-nums}
  .eq .big .cur{color:var(--faint); font-size:18px; margin-inline-start:4px}
  .eq .sub{display:flex; gap:16px; margin-top:10px; flex-wrap:wrap}
  .eq .sub span{color:var(--muted); font-size:12px}
  .eq .sub b{color:var(--txt); font-family:var(--mono); font-variant-numeric:tabular-nums}
  .chip{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-weight:600;
    padding:3px 9px; border-radius:8px; font-size:13px; font-variant-numeric:tabular-nums}
  .chip.up{color:var(--up); background:#14211b}
  .chip.down{color:var(--down); background:#221517}

  /* tabs */
  .tabs{display:flex; gap:2px; padding:0 10px; border-bottom:1px solid var(--line-soft)}
  .tab{appearance:none; background:none; border:0; color:var(--muted); font-family:var(--sans);
    font-size:13px; font-weight:600; padding:11px 12px; cursor:pointer; position:relative; transition:.15s}
  .tab[aria-selected="true"]{color:var(--txt)}
  .tab[aria-selected="true"]::after{content:""; position:absolute; inset-inline:8px; bottom:-1px; height:2px;
    background:var(--gold); border-radius:2px}
  .tab .n{color:var(--faint); font-family:var(--mono); font-size:11px; margin-inline-start:5px}

  /* panels */
  .panel{display:none; padding:12px 14px 16px}
  .panel[data-active]{display:block}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .stat{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:11px; padding:11px 12px}
  .stat .k{color:var(--muted); font-size:11px}
  .stat .v{font-family:var(--mono); font-size:17px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums}
  .wl{display:flex; align-items:baseline; gap:8px}
  .wl .w{color:var(--up)} .wl .l{color:var(--down)}
  .barwl{height:5px; border-radius:3px; margin-top:9px; overflow:hidden; display:flex; background:#221517}
  .barwl i{display:block; height:100%; background:var(--up)}

  /* rows */
  .filters{display:flex; gap:6px; margin-bottom:10px}
  .filters button{appearance:none; background:var(--surface-2); border:1px solid var(--line-soft); color:var(--muted);
    font-size:11px; font-weight:600; padding:5px 10px; border-radius:999px; cursor:pointer; transition:.12s; font-family:var(--sans)}
  .filters button[data-on]{color:var(--bg); background:var(--gold); border-color:var(--gold)}
  .list{max-height:280px; overflow:auto; margin:0 -4px; padding:0 4px}
  .list::-webkit-scrollbar{width:6px} .list::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
  .row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line-soft)}
  .row:last-child{border-bottom:0}
  .side{width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font-size:11px; font-weight:700; flex:none; font-family:var(--mono)}
  .side.buy{color:var(--up); background:#14211b} .side.sell{color:var(--down); background:#221517}
  .row .mid{flex:1; min-width:0}
  .row .sym{font-weight:600; font-size:13px}
  .row .meta{color:var(--faint); font-size:11px; font-family:var(--mono); margin-top:1px}
  .row .pnl{font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums; font-size:13px; text-align:end}
  .row .pnl small{display:block; color:var(--faint); font-weight:400; font-size:10px}
  .pos{color:var(--up)} .neg{color:var(--down)}

  .sig .sym{display:flex; align-items:center; gap:8px}
  .badge{font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; font-family:var(--mono)}
  .badge.blocked{color:var(--down); background:#221517; border:1px solid #3a2429}
  .badge.open{color:var(--gold); background:#211c12; border:1px solid #3a3016}
  .lvls{display:flex; gap:12px; margin-top:5px; font-family:var(--mono); font-size:11px}
  .lvls span{color:var(--faint)} .lvls b{font-variant-numeric:tabular-nums}
  .lvls .e{color:var(--txt)} .lvls .sl{color:var(--down)} .lvls .tp{color:var(--up)}
  .pat{color:var(--muted); font-size:11px; margin-top:4px; font-style:italic}

  .foot{padding:9px 16px; border-top:1px solid var(--line-soft); color:var(--faint); font-size:10px;
    font-family:var(--mono); display:flex; justify-content:space-between; align-items:center}
  .empty{color:var(--faint); text-align:center; padding:24px; font-size:12px}
</style>
</head>
<body>
<div class="card" id="card"></div>

<script>
/* ─────────────────────────────────────────────────────────────
   DATA — this is the injection point.
   In the real MCP widget the host injects this via
   mcpui.dev/ui-initial-render-data (or a postMessage on load).
   Here it holds the live values pulled from get_portfolio.
   ───────────────────────────────────────────────────────────── */
let DATA = {
  account:{ login:"preview", broker:"Demo Broker", currency:"USD",
    balance:1000.00, equity:1000.00, online:false, lastHeartbeat:"00:00:00 UTC" },
  todayPnl:1.79,
  openTrades:0,
  trades:[
    {sym:"XAUUSDM",side:"buy",qty:0.01,price:4184.831,pnl:-0.08,at:"02:58"},
    {sym:"XAUUSDM",side:"buy",qty:0.01,price:4185.565,pnl:-2.97,at:"02:58"},
    {sym:"XAUUSDM",side:"buy",qty:0.01,price:4185.455,pnl:0.24,at:"02:57"},
    {sym:"XAUUSDM",side:"buy",qty:0.01,price:4180.451,pnl:-0.74,at:"02:47"},
    {sym:"XAUUSDM",side:"buy",qty:0.01,price:4181.454,pnl:-0.63,at:"02:47"},
    {sym:"BTCUSDM",side:"sell",qty:0.01,price:61371.4,pnl:0.65,at:"02:37"},
    {sym:"BTCUSDM",side:"sell",qty:0.01,price:61351.43,pnl:0.45,at:"02:36"},
    {sym:"BTCUSDM",side:"sell",qty:0.01,price:61335.9,pnl:0.30,at:"02:35"},
    {sym:"BTCUSDM",side:"sell",qty:0.01,price:61278.58,pnl:0.11,at:"02:35"},
    {sym:"BTCUSDM",side:"sell",qty:0.01,price:61285.09,pnl:0.17,at:"02:35"},
    {sym:"XAUUSDM",side:"sell",qty:0.01,price:4178.562,pnl:0.19,at:"02:20"},
    {sym:"XAUUSDM",side:"sell",qty:0.01,price:4178.276,pnl:-0.32,at:"02:20"},
    {sym:"XAUUSDM",side:"buy",qty:0.01,price:4180.181,pnl:-1.50,at:"02:12"},
    {sym:"BTCUSDM",side:"buy",qty:0.01,price:61470.23,pnl:0.87,at:"02:06"},
    {sym:"BTCUSDM",side:"buy",qty:0.01,price:61532.79,pnl:0.26,at:"02:05"}
  ],
  signals:[
    {sym:"XAUUSDM",side:"buy",entry:4185.6,sl:4178.8,tp:4192.4,pat:"مثلث صاعد",blocked:true},
    {sym:"BTCUSDM",side:"sell",entry:61470,sl:61545,tp:61395,pat:"نموذج M",blocked:false},
    {sym:"BTCUSDM",side:"buy",entry:61495,sl:61455,tp:61540,pat:"مثلث صاعد",blocked:false},
    {sym:"XAUUSD",side:"buy",entry:4104,sl:4088,tp:4132,pat:"ارتداد لدعم",blocked:false},
    {sym:"CHFZAR",side:"buy",entry:20.2544,sl:20.2510,tp:20.2778,pat:"مثلث صاعد",blocked:true}
  ]
};

const money = (n,d=2)=> (n<0?"−":"") + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const px = n => n>=1000 ? n.toLocaleString("en-US",{maximumFractionDigits:2}) : n.toLocaleString("en-US",{maximumFractionDigits:4});

function render(){
  const a=DATA.account;
  const wins=DATA.trades.filter(t=>t.pnl>0).length;
  const losses=DATA.trades.filter(t=>t.pnl<=0).length;
  const wr = DATA.trades.length ? Math.round(wins/DATA.trades.length*100) : 0;
  const up = DATA.todayPnl>=0;

  document.getElementById("card").innerHTML = `
    <div class="hd">
      <div class="brand"><b><span class="ai">Ai</span>Chart</b><small>#${a.login} · ${a.broker}</small></div>
      <div class="spacer"></div>
      <span class="pill ${a.online?'on':'off'}"><span class="dot"></span>${a.online?'متصل':'غير متصل'}</span>
      <button class="refresh" id="rf" title="تحديث" aria-label="تحديث">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>

    <div class="eq">
      <div class="lbl">الإيكويتي</div>
      <div class="big">${px(a.equity)}<span class="cur">${a.currency}</span></div>
      <div class="sub">
        <span>الرصيد <b>${money(a.balance)}</b></span>
        <span>ربح اليوم <span class="chip ${up?'up':'down'}">${up?'▲':'▼'} ${money(DATA.todayPnl)}</span></span>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="ov" aria-selected="true">نظرة عامة</button>
      <button class="tab" role="tab" data-tab="tr" aria-selected="false">الصفقات<span class="n">${DATA.trades.length}</span></button>
      <button class="tab" role="tab" data-tab="sg" aria-selected="false">التوصيات<span class="n">${DATA.signals.length}</span></button>
    </div>

    <div class="panel" data-panel="ov" data-active>
      <div class="stats">
        <div class="stat"><div class="k">صفقات مفتوحة</div><div class="v">${DATA.openTrades}</div></div>
        <div class="stat"><div class="k">نسبة الربح · آخر ${DATA.trades.length}</div>
          <div class="v">${wr}<span style="font-size:12px;color:var(--muted)">%</span></div>
          <div class="wl" style="font-size:11px;margin-top:2px"><span class="w">${wins} ربح</span><span class="l">${losses} خسارة</span></div>
          <div class="barwl"><i style="width:${wr}%"></i></div>
        </div>
        <div class="stat"><div class="k">حالة الجسر (EA)</div><div class="v" style="font-size:14px;color:${a.online?'var(--up)':'var(--down)'}">${a.online?'يعمل':'متوقف'}</div>
          <div style="color:var(--faint);font-size:10px;font-family:var(--mono);margin-top:3px">آخر نبضة ${a.lastHeartbeat}</div></div>
        <div class="stat"><div class="k">نوع الحساب</div><div class="v" style="font-size:14px">حقيقي · ${a.currency}</div>
          <div style="color:var(--faint);font-size:10px;font-family:var(--mono);margin-top:3px">MT5 · ${a.broker}</div></div>
      </div>
    </div>

    <div class="panel" data-panel="tr">
      <div class="filters" id="flt">
        <button data-f="all" data-on>الكل</button>
        <button data-f="XAU">ذهب</button>
        <button data-f="BTC">بيتكوين</button>
      </div>
      <div class="list" id="trlist"></div>
    </div>

    <div class="panel sig" data-panel="sg">
      <div class="list">${DATA.signals.map(s=>`
        <div class="row" style="display:block">
          <div class="sym"><span class="side ${s.side}" style="width:auto;height:auto;padding:2px 6px">${s.side==='buy'?'شراء':'بيع'}</span>
            <b style="font-size:13px">${s.sym}</b>
            <span class="badge ${s.blocked?'blocked':'open'}">${s.blocked?'محظورة (فيتو)':'قابلة للتنفيذ'}</span></div>
          <div class="lvls"><span>دخول <b class="e">${px(s.entry)}</b></span><span>وقف <b class="sl">${px(s.sl)}</b></span><span>هدف <b class="tp">${px(s.tp)}</b></span></div>
          <div class="pat">${s.pat}</div>
        </div>`).join("")}</div>
    </div>

    <div class="foot"><span>get_portfolio</span><span>محدّث الآن</span></div>
  `;

  // tabs
  card.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    card.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===t));
    card.querySelectorAll(".panel").forEach(p=>p.toggleAttribute("data-active", p.dataset.panel===t.dataset.tab));
  });
  // trade filter
  const drawTrades=(f)=>{
    const rows = DATA.trades.filter(t=> f==='all' || t.sym.startsWith(f)).map(t=>`
      <div class="row">
        <div class="side ${t.side}">${t.side==='buy'?'BUY':'SELL'}</div>
        <div class="mid"><div class="sym">${t.sym}</div><div class="meta">${t.qty} @ ${px(t.price)} · ${t.at}</div></div>
        <div class="pnl ${t.pnl>=0?'pos':'neg'}">${money(t.pnl)}<small>مغلقة</small></div>
      </div>`).join("");
    document.getElementById("trlist").innerHTML = rows || `<div class="empty">لا صفقات ضمن هالفلتر</div>`;
  };
  drawTrades("all");
  card.querySelectorAll("#flt button").forEach(b=>b.onclick=()=>{
    card.querySelectorAll("#flt button").forEach(x=>x.removeAttribute("data-on"));
    b.setAttribute("data-on","");
    drawTrades(b.dataset.f);
  });
  // refresh → tool call back to host (MCP Apps / mcp-ui postMessage bridge)
  document.getElementById("rf").onclick=()=>{
    window.parent.postMessage({ type:"tool", payload:{ toolName:"get_portfolio", params:{} } }, "*");
  };
}

// hydrate from host-injected data if provided, else use preview DATA
window.addEventListener("message",(e)=>{
  const d=e.data;
  if(d && d.type==="ui-lifecycle-iframe-render-data" && d.payload?.renderData){
    DATA = d.payload.renderData; render();
  }
});

const card=document.getElementById("card");
render();
</script>
</body>
</html>
